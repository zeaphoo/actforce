[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/agent-core",
    "crates/file-service",
    "crates/entitlement",
    "crates/actforce-core",
    "crates/actforce",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Actforce Devs"]
license = "UNLICENSED"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-std", "process", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
toml = "0.8"
dirs = "5"
chrono = "0.4"
uuid = "1"
tokio-stream = "0.1"
axum = { version = "0.8", features = ["macros"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
futures = "0.3"
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
dotenvy = "0.15"
once_cell = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "chrono"] }
walkdir = "2"
minijinja = { version = "2", features = ["loader"] }
notify = "7"
