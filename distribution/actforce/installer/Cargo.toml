[package]
name = "actforce-installer"
version = "0.2.0"
edition = "2021"
description = "ActForce Installation and Upgrade Tool"
authors = ["ActForce Team"]
publish = false

[workspace]

[dependencies]
clap = { version = "4.4", features = ["derive"] }
log = "0.4"
env_logger = "0.10"
anyhow = "1.0"
thiserror = "1.0"
colored = "2.0"
tempfile = "3.8"
flate2 = "1.0"
tar = "0.4"
walkdir = "2.4"
chrono = "0.4"
fs_extra = "1.3"
regex = "1.10"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
