services:
  actforce:
    image: actforce:latest
    container_name: actforce
    restart: unless-stopped
    environment:
      - ACTFORCE_DATA_ROOT=/app/data
      - ACTFORCE_DEBUG=${ACTFORCE_DEBUG:-false}
    volumes:
      - actforce-data:/app/data
    ports:
      - "${ACTFORCE_PORT:-5020}:5020"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:5020/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  actforce-data:
    name: actforce-data
